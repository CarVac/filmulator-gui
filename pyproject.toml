[project]
name = "filmulator-gui"
version = "0.11.1"
description = "A Qt Quick GUI film emulator for RAW photo processing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clang-format>=21",
    "clang-tidy>=21",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pillow>=12.1.1",
]

[tool.uv]
dev-dependencies = [
    "pytest",
]
